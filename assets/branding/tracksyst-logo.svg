<!--
  TrackSyst SMSI — logo combiné HORIZONTAL.

  Format bandeau 400×80 (ratio 5:1). Idéal :
    - en-tête de rapport PDF
    - signature email
    - bandeau supérieur de présentation

  Composition :
    - Icône bi-shield-check Bootstrap Icons v1.11.3 (blanc) sur carré
      arrondi #0d6efd (Bootstrap primary), à gauche
    - "TrackSyst SMSI" en bold, couleur #0d6efd
    - Tagline "Système de management de la sécurité de l'information"
      en gris #495057

  Police : sans-serif système (Helvetica Neue, Helvetica, Arial), pour
  rendu PDF maximal sans embed de font.

  Fond : transparent.
-->
