    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --primary: #0d6efd;
            --primary-dark: #0a58ca;
            --primary-light: #e3f2fd;
            --dark: #0f172a;
            --gray-700: #495057;
            --gray-500: #6c757d;
            --bg-soft: #f8fafc;
            --border: #e2e8f0;
            --radius: 10px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--dark);
            background:
                radial-gradient(circle at 80% 20%, rgba(13,110,253,0.08) 0%, transparent 50%),
                radial-gradient(circle at 20% 80%, rgba(13,110,253,0.05) 0%, transparent 50%),
                var(--bg-soft);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        .wrap {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        .card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 50px 40px;
            text-align: center;
            max-width: 520px;
            box-shadow: 0 20px 50px rgba(13,110,253,0.10);
        }
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
            margin-bottom: 30px;
        }
        .brand-icon {
            width: 36px; height: 36px;
            background: var(--primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .code {
            font-size: 84px;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
            margin-bottom: 10px;
            letter-spacing: -2px;
        }
        h1 {
            font-size: 24px;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 12px;
        }
        p {
            color: var(--gray-700);
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 20px;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            border: 2px solid;
            transition: all .15s;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
        }
        .btn-outline {
            background: white;
            color: var(--primary);
            border-color: var(--primary);
        }
        .btn-outline:hover {
            background: var(--primary-light);
        }
        footer {
            text-align: center;
            color: var(--gray-500);
            font-size: 12px;
            padding: 20px;
        }
    </style>
</head>
